<!-- show list of archives as a bulleted list -->
 <style>
    .md-nav__item {
        padding-bottom: 0.5em;
    }
/*    .md-nav__title {
        font-weight: bold;
        padding-bottom: 0.5em;
    } */
    .md-nav__list {
        padding-top: 0.5em;
    }
</style>
<!-- <h3 class="archive-title">Archives</h3> -->
<nav class="md-nav md-nav--secondary" aria-label="Archives">
    <label class="md-nav__title" for="__toc">
        Archives
    </label>
    <!-- <ul class="archives-list"> -->
    <ul class="md-nav__list">
        {% for archive in page.meta.archives %}
        <li class="md-nav__item">
            <a href="archives/{{ archive.month }}-{{ archive.year }}.html" class="md-nav__link">
            {{ archive.month }} {{ archive.year }} - {{ archive.count }} 
            {% if archive.count == 1 %}
                post 
            {% else %}
                posts 
            {% endif %}
            </a>
        </li>
        {% endfor %}
    </ul>
</nav>

<div class="modal micromodal-slide" id="modal-1" aria-hidden="true">
	<div class="modal__overlay" tabindex="-1" data-micromodal-close>
		<div class="modal__container" role="dialog" aria-modal="true" aria-labelledby="modal-1-title">
			<header class="modal__header">
				<h2 class="modal__title" id="modal-1-title">
					Search
				</h2>
			</header>
			<main class="modal__content" id="modal-1-content">
				<div id="search"></div>
			</main>
			<footer class="modal__footer">
					<button class="modal__btn modal__btn-primary" data-micromodal-close aria-label="Close modal">Close</button>
			</footer>
		</div>
	</div>
</div>
