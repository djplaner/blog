
site_name: "Some Assemblage Required"
site_url: https://djon.es/blog/
site_description: "Tinkering with technology and life beyond work"
repo_url: https://github.com/djplaner/blog
site_author: "David Jones"
site_dir: ../blog2 # stick HTML outside main repo
use_directory_urls: false

theme:
  name: material
  font: 
    text: Gabarito
    code: Roboto Mono
  palette: 
    - scheme: memexdark
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: memexlight
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

  #  favicon: attachment/portrait.png
  #favicon: assets/memex.png
  #logo: assets/spider_web.png

  custom_dir: overrides
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
#    - navigation.instant
#    - navigation.expand 
    - content.tabs.links
    - navigation.path
#    - navigation.indexes
    - navigation.footer
#    - navigation.sections
#    - toc.follow
#    - toc.integrate
    - header.autohide
#    - search.suggest
markdown_extensions: 
  - pymdownx.arithmatex:
      generic: true
  - attr_list # https://squidfunk.github.io/mkdocs-material/reference/images/
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid 
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: '#' # heading anchor 
  - admonition
  - codehilite:
      guess_lang: false
      linenums: false
  - footnotes
  - meta
  - def_list
#  - pymdownx.arithmatex:thinking: 
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tasklist
  - pymdownx.tilde
plugins:
#  - search
  - macros:
      module_name: generators/macros
  - social
  - glightbox
  - mkdocs-video
  - mkdocs-pdf
  - gen-files:
      scripts:
        - generators/blog.py ## TODO generate dynamically generated blogs
  - roamlinks 
  - exclude:
      glob:
        - "*.tmp"
        - "*.pdf"
        - "*.gz"
      regex:
        - '.*\.(tmp|bin|tar)$'
  - markdownextradata

extra_css:
  - stylesheets/extra.css
  - /blog/pagefind/pagefind-ui.css
extra_javascript:
  - /blog/pagefind/pagefind-ui.js
extra:
  social:
  - icon: fontawesome/brands/mastodon
    link: https://indieweb.social/@djplaner
  - icon: fontawesome/brands/github
    link: https://github.com/djplaner
  - icon: fontawesome/solid/rss
    link: https://djon.es/blog2/feed/feed.rss
  category_pages:
    generate: True
  archive_pages:
    generate: True

# Specify navigation structure
nav:
  - Home: index.md
  - About: about.md
  - Categories: category/index.md
  - Archives: archives/index.md
#  - Pages: pages.md
#  - Posts: posts.md

validation:
  nav:
    omitted_files: ignore
  links: 
    absolute_links: ignore


# Specify files to exclude from navigation checks
#not_in_nav: |
#  sense/*
#  share/*
#  blog/publications/*
